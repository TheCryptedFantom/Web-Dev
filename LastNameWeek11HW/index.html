<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 11 - DOM Events</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <h1 id="title">Events Demo</h1>

    <!-- Theme toggle section -->
    <button id="themeToggle">Toggle Theme</button>

    <!-- Section to add/remove list items -->
    <section>
      <h2>Add / Remove Items</h2>
      <button id="addItem">Add Item</button>
      <ul id="items"></ul>
    </section>

    <!-- Section that reacts to keyboard -->
    <section>
      <h2>Keyboard Demo</h2>
      <p id="keyOutput">Press any key...</p>
    </section>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
