<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2</title>
</head>
<body>
    <h1>Hello, World!</h1>
    <!-- This is a comment 
    Make it a good habit to use them-->

    <div>
        <!--Generic Container, has no meaning by itself. Mainly used for styling or layout-->
    </div>
    
    <header>
        <!--Top section of the page. Usually contains the site logo, navigation menu, and other important links-->
    </header>

    <nav>
        <!--Container navigation links, tells browser/ screen readers 'This is the site menu'-->
    </nav>

    <section>
        <!--Groups related content inside <main> (Chapters in a book)-->
    </section>

    <footer>
        <!--Bottom of the page. Usually contains copyright information, contact details, and other footer content-->
    </footer>

    <ul>
        <!--Unordered list, used for a list of items without a specific order, Bullet List-->
    </ul>

    <ol>
        <!--Ordered list, used for a list of items with a specific order, Numbered List-->
    </ol>

    <li>
        <!--List item, used inside <ul> or <ol> to represent an item in the list-->
    </li>

    <table>
        <!--Table, used to display data in a grid format with rows and columns-->
    </table>

    <tr>
        <!--Table row, used inside <table> to represent a row in the table-->
    </tr>

    <th>
        <!--Table header, used inside <tr> to represent a header cell in the table-->
    </th>

    <td>
        <!--Table cell, used inside <tr> to represent a cell in the table-->
    </td>

</body>
</html>
